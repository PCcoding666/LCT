name: macOS Bug Report
description: Report a problem with LCT for macOS
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This branch maintains LCT for macOS. Search the [existing issues](https://github.com/PCcoding666/LCT/issues) before reporting a problem.
        Windows source and releases are preserved in the [Windows archive](https://github.com/PCcoding666/LCT/blob/master/docs/WINDOWS_ARCHIVE.md).
        Please remove private captions, transcripts, and credentials from attachments.
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start LCT using ...
        2. Select system audio / microphone / both ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: system-info
    attributes:
      label: Environment
      placeholder: |
        macOS version:
        Mac model / chip / memory:
        LCT version or commit:
        Installation or launch method:
        Audio source and source / target languages:
        Ollama version and model:
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Diagnostics and screenshots
      description: Include relevant permission status, errors, or redacted screenshots. Never include credentials or private transcripts.
  - type: checkboxes
    id: validations
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed private transcripts and credentials from this report.
          required: true
