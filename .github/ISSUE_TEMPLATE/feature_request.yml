name: macOS Feature Request
description: Suggest an improvement to LCT for macOS
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search the [existing issues](https://github.com/PCcoding666/LCT/issues) before submitting a suggestion.
        The active project is LCT for macOS; Windows is [archived](https://github.com/PCcoding666/LCT/blob/master/docs/WINDOWS_ARCHIVE.md).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and the outcome you need.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested behavior
      description: Explain how you would expect it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and additional context
      description: Include relevant examples or screenshots with private information removed.
