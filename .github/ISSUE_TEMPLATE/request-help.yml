name: macOS Help
description: Ask about using or building LCT for macOS
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        See the [macOS guide](https://github.com/PCcoding666/LCT/blob/master/macos/README.md) and [existing issues](https://github.com/PCcoding666/LCT/issues) first.
        Historical Windows instructions are in the [Windows archive](https://github.com/PCcoding666/LCT/blob/master/docs/WINDOWS_ARCHIVE.md).
  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
      description: Explain what you are trying to do and what you have tried.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        macOS version and Mac chip:
        LCT version or commit:
        Installation or launch method:
        Ollama version and model (if relevant):
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Share relevant errors or screenshots with private transcripts and credentials removed.
